name: Build AJ MoneyPro Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Wrap with Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Compile Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload AJMoneyPro.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AJMoneyPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
