<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Navy Blue Background Gradient -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Royal Blue to Emerald Green Accent Gradient -->
    <linearGradient id="fintechAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Royal Glow -->
    <linearGradient id="royalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Navy Blue -->
  <rect width="512" height="512" rx="128" fill="url(#navyBg)"/>
  <rect x="14" y="14" width="484" height="484" rx="114" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Geometric Shield Crest -->
  <g filter="url(#glowShadow)">
    <path d="M 256,92 L 388,148 C 388,272 332,364 256,416 C 180,364 124,272 124,148 Z" fill="url(#fintechAccent)" opacity="0.95"/>
    <path d="M 256,118 L 362,162 C 362,266 316,346 256,390 C 196,346 150,266 150,162 Z" fill="#0f172a"/>

    <!-- Dynamic "AJ" Monogram & Financial Growth Pillars -->
    <!-- Letter 'A' (Left & Peak) -->
    <path d="M 230,174 L 178,326 L 210,326 L 222,290 L 254,290 L 254,262 L 232,262 L 242,230 L 252,230 L 252,174 Z" fill="#ffffff"/>
    
    <!-- Letter 'J' & Ascending Growth Hook (Right & Bottom Curve in Emerald Green) -->
    <path d="M 268,174 L 302,174 L 302,292 C 302,324 282,342 248,342 C 228,342 212,336 202,328 L 216,302 C 224,308 234,314 246,314 C 262,314 270,306 270,290 L 270,174 Z" fill="url(#emeraldGrad)"/>

    <!-- Upward Trend Arrow in Emerald & Cyan -->
    <path d="M 194,248 L 246,204 L 286,220 L 332,160" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="338,154 316,160 330,174" fill="#34d399"/>

    <!-- Subtle PRO Badge pill underneath -->
    <rect x="216" y="360" width="80" height="22" rx="11" fill="url(#royalGrad)"/>
    <text x="256" y="375" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>
</svg>
